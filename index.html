<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>US CODE NAVIGATOR</title>
<script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    .sidebar-item {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sidebar-item:hover {
      background-color: #374785;
      border-left: 4px solid #F76C6C;
      padding-left: 1.25rem;
    }

    .sidebar-item.active {
      background-color: #374785;
      border-left: 4px solid #F76C6C;
    }

    .code-card {
      transition: all 0.3s ease;
    }

    .code-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(168, 208, 230, 0.25);
      border-color: #A8D0E6;
    }

    .search-input:focus {
      outline: none;
      border-color: #A8D0E6;
      box-shadow: 0 0 0 3px rgba(168, 208, 230, 0.15);
    }

    .feature-card {
      transition: all 0.2s ease;
    }

    .feature-card:hover {
      background-color: rgba(168, 208, 230, 0.08);
      border-color: #A8D0E6;
    }

    .chapter-item {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .chapter-item:hover {
      background-color: #A8D0E6;
      transform: translateX(4px);
    }

    .chapter-item.active {
      background-color: #F8E9A1;
      border-left: 3px solid #F76C6C;
    }

    .content-section {
      border-left: 3px solid #A8D0E6;
      padding-left: 1rem;
    }

    .result-item {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .result-item:hover {
      background-color: #f9fafb;
      border-left: 3px solid #A8D0E6;
      padding-left: 1.25rem;
    }

    .compare-panel {
      border: 2px solid #e5e7eb;
      transition: all 0.2s ease;
    }

    .compare-panel:hover {
      border-color: #A8D0E6;
    }

    .diff-added {
      background-color: #d1fae5;
      border-left: 3px solid #10b981;
    }

    .diff-removed {
      background-color: #fee2e2;
      border-left: 3px solid #ef4444;
    }

    .diff-modified {
      background-color: #fef3c7;
      border-left: 3px solid #f59e0b;
    }

    .section-content {
      display: none;
    }

    .section-content.active {
      display: block;
    }

    /* Enhanced diff highlighting styles for better visual clarity */
    .diff-added {
      background: linear-gradient(to right, #d1fae5 0%, #ecfdf5 100%);
      border-left: 4px solid #10b981;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 4px rgba(16, 185, 129, 0.1);
    }

    .diff-removed {
      background: linear-gradient(to right, #fee2e2 0%, #fef2f2 100%);
      border-left: 4px solid #ef4444;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.1);
    }

    .diff-modified {
      background: linear-gradient(to right, #fef3c7 0%, #fefce8 100%);
      border-left: 4px solid #f59e0b;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 4px rgba(245, 158, 11, 0.1);
    }

    .diff-label {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 3px;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .diff-added .diff-label {
      background-color: #d1fae5;
      color: #065f46;
    }

    .diff-removed .diff-label {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .diff-modified .diff-label {
      background-color: #fef3c7;
      color: #92400e;
    }

    /* Added collapsible section styles */
    .collapsible-header {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .collapsible-header:hover {
      background-color: #f9fafb;
    }

    .collapsible-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .collapsible-content.expanded {
      max-height: 2000px;
    }

    .rotate-180 {
      transform: rotate(180deg);
    }

    /* Added modal styles for figures & tables popup */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
    }

    /* Added highlight styles for actual text differences */
    .text-highlight-added {
      background-color: #86efac;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 600;
    }

    .text-highlight-removed {
      background-color: #fca5a5;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 600;
      text-decoration: line-through;
    }

    .text-highlight-modified {
      background-color: #fde047;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 600;
    }

    /* Added search button hover effect with #F76C6C */
    .search-button {
      transition: all 0.2s ease;
    }

    .search-button:hover {
      background-color: #e55a5a;
    }

    /* Added horizontal scroll for figures & tables */
    .figures-scroll {
      display: flex;
      overflow-x: auto;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .figures-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .figures-scroll::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    .figures-scroll::-webkit-scrollbar-thumb {
      background: #A8D0E6;
      border-radius: 3px;
    }

    .figures-scroll::-webkit-scrollbar-thumb:hover {
      background: #8fc0d9;
    }

    /* Added clear button styles for section inputs */
    .input-wrapper {
      position: relative;
    }

    .clear-button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .clear-button:hover {
      background-color: #f3f4f6;
    }

    .input-wrapper input:not(:placeholder-shown) ~ .clear-button {
      display: block;
    }

    /* Made diff labels more subtle */
    .diff-label {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 3px;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .diff-added .diff-label {
      background-color: #d1fae5;
      color: #065f46;
    }

    .diff-removed .diff-label {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .diff-modified .diff-label {
      background-color: #fef3c7;
      color: #92400e;
    }

    /* Added search highlight styles */
    .search-highlight {
      background-color: #fde047;
      padding: 2px 4px;
      border-radius: 2px;
      font-weight: 600;
    }

    /* Added clear button styles for search input */
    .search-input-wrapper {
      position: relative;
    }

    .search-clear-button {
      position: absolute;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      transition: all 0.2s ease;
      background-color: #f3f4f6;
    }

    .search-clear-button:hover {
      background-color: #e5e7eb;
    }

    .search-input-wrapper input:not(:placeholder-shown) ~ .search-clear-button {
      display: block;
    }

    /* Added smaller radio button styles */
    input[type="checkbox"] {
      width: 14px;
      height: 14px;
    }

    /* Added collapsible result item styles */
    .result-collapsible {
      cursor: pointer;
    }

    .result-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .result-content.expanded {
      max-height: 500px;
    }

    /* Added modal styles for section content popup */
    .section-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      overflow-y: auto;
    }

    .section-modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
    }

    .section-modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      margin: auto;
    }

    /* Line clamp utilities for truncating text */
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

  </style>
</head>
<body class="bg-gray-50">
<!-- Sidebar -->
<aside class="fixed left-0 top-0 h-full w-64 bg-[#24305E] text-white shadow-lg z-10">
<div class="p-6 py-4 border-b border-[#374785]">
<h1 class="text-xl font-bold text-[#F8E9A1]">US CODE NAVIGATOR</h1>
</div>
<nav class="mt-6">
<div class="sidebar-item active flex items-center px-6 py-3 text-white" data-section="home">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
        홈
      </div>
<!-- Library menu with dynamic submenu -->
<div>
<div class="sidebar-item flex items-center justify-between px-6 py-3 text-white" onclick="toggleLibraryMenu()">
<div class="flex items-center">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
            라이브러리
          </div>
<svg class="w-4 h-4 transition-transform" fill="none" id="libraryMenuIcon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Dynamic submenu items will be loaded here -->
<div class="overflow-hidden transition-all duration-300" id="librarySubmenu" style="max-height: 0;">
  <!-- Populated dynamically from JSON -->
</div>
</div>
<div class="sidebar-item flex items-center px-6 py-3 text-white" data-section="search">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
        고급 검색
      </div>
<div class="sidebar-item flex items-center px-6 py-3 text-white" data-section="compare">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
        코드 비교
      </div>
</nav>
</aside>

<!-- Main Content -->
<main class="ml-64 min-h-screen">
<!-- Top Search Bar -->
<header class="bg-white border-b border-gray-200 sticky top-0 shadow-sm z-20">
<div class="px-8 py-4">
<div class="max-w-2xl mx-auto search-input-wrapper">
<input class="search-input w-full px-4 py-3 pl-12 pr-24 border-2 border-gray-300 rounded-lg text-[#24305E] transition-all" id="topSearchInput" placeholder="Search codes, keywords, chapters..." type="text"/>
<svg class="w-5 h-5 absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<button class="search-clear-button" onclick="clearSearchInput()" title="Clear search">
<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="search-button absolute right-2 top-1/2 transform -translate-y-1/2 bg-[#F76C6C] text-white p-2 rounded-md hover:bg-[#e55a5a] transition-colors" onclick="performTopSearch()" title="Search">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 7l5 5m0 0l-5 5m5-5H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</header>

<!-- Home Section -->
<div class="section-content active" id="homeSection">
<div class="p-8">
<div class="max-w-7xl mx-auto">
<!-- Quick Actions -->
<section class="mb-12">
<h2 class="text-2xl font-bold text-[#24305E] mb-6">Quick Actions</h2>
<div class="grid grid-cols-2 gap-6">
<div class="feature-card bg-white p-6 rounded-lg border-2 border-gray-200 cursor-pointer" data-nav="search">
<div class="flex items-start gap-4">
<div class="w-12 h-12 bg-[#F76C6C] bg-opacity-10 rounded-lg flex items-center justify-center flex-shrink-0">
<svg class="w-6 h-6 text-[#F76C6C]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<h3 class="font-semibold text-[#24305E] mb-1">고급 검색</h3>
<p class="text-sm text-gray-600">여러 코드를 검색하고 필터링하기</p>
</div>
</div>
</div>
<div class="feature-card bg-white p-6 rounded-lg border-2 border-gray-200 cursor-pointer" data-nav="compare">
<div class="flex items-start gap-4">
<div class="w-12 h-12 bg-[#A8D0E6] bg-opacity-20 rounded-lg flex items-center justify-center flex-shrink-0">
<svg class="w-6 h-6 text-[#374785]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<h3 class="font-semibold text-[#24305E] mb-1">코드 비교</h3>
<p class="text-sm text-gray-600">다양한 코드 버전을 나란히 비교</p>
</div>
</div>
</div>
</div>
</section>

<!-- Available Codes -->
<section>
<h2 class="text-2xl font-bold text-[#24305E] mb-6">Available Codes</h2>
<div class="grid grid-cols-3 gap-6" id="homeCodeCards">
  <!-- Populated dynamically from JSON -->
  <p class="text-gray-500 text-center py-4">Loading...</p>
</div>
</section>
</div>
</div>
</div>

<!-- Library Section -->
<div class="section-content" id="librarySection">
<header class="bg-white border-b border-gray-200 shadow-sm">
<div class="px-8 py-6 flex items-center gap-4">
<button class="p-2 hover:bg-gray-100 rounded-lg transition-colors" onclick="showSection('home')" title="Back to home">
<svg class="w-6 h-6 text-[#24305E]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div>
<h1 class="text-3xl font-bold text-[#24305E]" id="codeTitle">Code Title</h1>
<p class="text-gray-600 mt-1" id="codeSubtitle">Code Description</p>
</div>
</div>
</header>
<div class="p-8">
<div class="flex gap-8">
<!-- Chapter list sidebar -->
<div class="w-72 flex-shrink-0">
<div class="bg-white rounded-lg shadow-md p-4 sticky top-24">
<h3 class="font-semibold text-[#24305E] mb-4">Chapters</h3>
<div class="space-y-1" id="chapterList">
  <!-- Populated dynamically from JSON -->
  <p class="text-gray-500 text-sm text-center py-4">Loading...</p>
</div>
</div>
</div>

<div class="flex-1">
<div class="bg-white rounded-lg shadow-md p-6" id="libraryContent">

  <div class="text-center text-gray-500 py-8">
    <p>좌측 챕터 목록에서 챕터를 선택하세요.</p>
  </div>
</div>
</div>
</div>
</div>
</div>

<!-- Advanced Search Section -->
<div class="section-content" id="searchSection">
<header class="bg-white border-b border-gray-200 shadow-sm">
<div class="px-8 py-6">
<h1 class="text-3xl font-bold text-[#24305E]">고급 검색</h1>
<p class="text-gray-600 mt-1">모든 코드 라이브러리에서 필터링 및 검색</p>
</div>
</header>
<div class="p-8">
<div class="bg-white rounded-lg shadow-md p-6 mb-6">
<div class="mb-6">
<label class="block text-sm font-semibold text-[#24305E] mb-2">키워드 검색</label>
<div class="relative" style="max-width: 50%;">
<input class="w-full px-4 py-2.5 pr-10 border-2 border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:border-[#F76C6C]"
       id="keywordInput"
       placeholder="검색어를 입력하세요..."
       type="text"
       onkeypress="if(event.key==='Enter') performSearch()"/>

        onclick="performSearch()"
        title="검색">
<svg class="w-5 h-5 text-[#F76C6C]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 7l5 5m0 0l-5 5m5-5H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<div class="flex gap-3 mt-6">
<button class="flex-1 bg-[#F76C6C] text-white py-3 rounded-lg font-semibold hover:bg-[#e55a5a] transition-colors" onclick="performSearch()">
              검색
            </button>

<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>

<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-bold text-[#24305E]">검색 결과</h2>
<span class="text-sm text-gray-600" id="resultCount">0개 결과</span>
</div>

<!-- Search results will be populated here -->
</div>
</div>
</div>
</div>

<!-- Code Compare Section -->
<div class="section-content" id="compareSection">
<header class="bg-white border-b border-gray-200 shadow-sm">
<div class="px-8 py-6">
<h1 class="text-3xl font-bold text-[#24305E]">코드 비교</h1>
<p class="text-gray-600 mt-1">다양한 코드 버전을 나란히 비교</p>
</div>
</header>
<div class="p-8">
<div class="bg-white rounded-lg shadow-md p-6 mb-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block text-sm font-semibold text-[#24305E] mb-2">Code A</label>
<select class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-3 focus:outline-none focus:border-[#A8D0E6]" id="codeAType">
  <!-- Populated dynamically -->
</select>
<select class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-3 focus:outline-none focus:border-[#A8D0E6]" id="codeAVersion">
  <!-- Populated dynamically -->
</select>
</div>
<div>
<label class="block text-sm font-semibold text-[#24305E] mb-2">Code B</label>
<select class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-3 focus:outline-none focus:border-[#A8D0E6]" id="codeBType">
  <!-- Populated dynamically -->
</select>
<select class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-3 focus:outline-none focus:border-[#A8D0E6]" id="codeBVersion">
  <!-- Populated dynamically -->
</select>
</div>
</div>
<button class="w-full mt-6 bg-[#F76C6C] text-white py-3 rounded-lg font-semibold hover:bg-[#e55a5a] transition-colors" onclick="performCompare()">
              비교
            </button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="comparisonResults">
<!-- Comparison results will be populated here -->
</div>
</div>
</div>

</main>

<!-- Image Modal -->
<div class="modal" id="imageModal">
<div class="modal-content" style="max-width: 90vw; max-height: 90vh; overflow-y: auto;">

<div class="flex items-center gap-2">

</button>

<path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>

<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>

</svg>

<script>
// ============================================
// Global Data Storage
// ============================================
let appData = {
  modelCodes: [],
  modelCodeVersions: [],
  codeChapters: [],
  codeContents: [],
  codeAttachments: [],
  disciplines: [],
  modelCodeDisciplines: []
};

// Image base path
const IMAGE_BASE_PATH = 'image/';

// ============================================
// Data Loading Functions
// ============================================
async function loadJSON(filename) {
  try {
    const response = await fetch(`data/${filename}`);
    if (!response.ok) throw new Error(`Failed to load ${filename}`);
    return await response.json();
  } catch (error) {
    console.error(`Error loading ${filename}:`, error);
    return [];
  }
}

async function loadAllData() {
  console.log('Loading data from JSON files...');

  const [
    modelCodes,
    modelCodeVersions,
    codeChapters,
    codeContents,
    codeAttachments,
    disciplines,
    modelCodeDisciplines
  ] = await Promise.all([
    loadJSON('ModelCode.json'),
    loadJSON('ModelCodeVersion.json'),
    loadJSON('CodeChapter.json'),
    loadJSON('CodeContent.json'),
    loadJSON('CodeAttachment.json'),
    loadJSON('Discipline.json'),
    loadJSON('ModelCodeDiscipline.json')
  ]);

  appData = {
    modelCodes,
    modelCodeVersions,
    codeChapters,
    codeContents,
    codeAttachments,
    disciplines,
    modelCodeDisciplines
  };

  console.log('Data loaded successfully:', appData);

  // Initialize UI after data is loaded
  initializeUI();
}

// ============================================
// UI Initialization
// ============================================
function initializeUI() {
  populateLibrarySubmenu();
  populateHomeCodeCards();
  populateCompareSelectors();
}

function populateLibrarySubmenu() {
  const submenu = document.getElementById('librarySubmenu');

  // Get versions that have chapters (active codes)
  const activeVersionIds = [...new Set(appData.codeChapters.map(ch => ch.ModelCodeVersionID))];
  const activeVersions = appData.modelCodeVersions.filter(v => activeVersionIds.includes(v.ModelCodeVersionID));

  let html = '';
  activeVersions.forEach(version => {
    const code = appData.modelCodes.find(c => c.ModelCodeID === version.ModelCodeID);
    if (code) {
      html += `
        <div class="submenu-item flex items-center pl-14 pr-6 py-2 text-sm text-gray-300 hover:text-white hover:bg-[#374785] rounded cursor-pointer transition-colors"
             data-version-id="${version.ModelCodeVersionID}"
             data-code-id="${code.ModelCodeID}"
             onclick="loadCodeFromSidebar('${version.ModelCodeVersionID}', '${code.ModelCodeID}')">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect height="20" rx="2" ry="2" width="16" x="4" y="2"></rect>
            <path d="M9 22v-4h6v4"></path>
          </svg>
          ${code.ModelCodeName} ${version.Year}
        </div>
      `;
    }
  });

  submenu.innerHTML = html;
}

function populateHomeCodeCards() {
  const container = document.getElementById('homeCodeCards');

  // Get versions that have chapters
  const activeVersionIds = [...new Set(appData.codeChapters.map(ch => ch.ModelCodeVersionID))];
  const activeVersions = appData.modelCodeVersions.filter(v => activeVersionIds.includes(v.ModelCodeVersionID));

  let html = '';
  activeVersions.forEach(version => {
    const code = appData.modelCodes.find(c => c.ModelCodeID === version.ModelCodeID);
    if (code) {
      const chapterCount = appData.codeChapters.filter(ch => ch.ModelCodeVersionID === version.ModelCodeVersionID).length;
      html += `
        <div class="code-card bg-white p-6 rounded-lg border-2 border-gray-200 cursor-pointer"
             onclick="loadCodeFromSidebar('${version.ModelCodeVersionID}', '${code.ModelCodeID}')">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 bg-[#24305E] rounded-lg flex items-center justify-center flex-shrink-0">
              <span class="text-white font-bold text-sm">${code.ModelCodeName.substring(0, 3)}</span>
            </div>
            <div>
              <h3 class="font-semibold text-[#24305E] mb-1">${code.ModelCodeName} ${version.Year}</h3>
              <p class="text-sm text-gray-600">${code.DescriptionEN}</p>
              <p class="text-xs text-gray-400 mt-2">${chapterCount} Chapters</p>
            </div>
          </div>
        </div>
      `;
    }
  });

  container.innerHTML = html || '<p class="text-gray-500">No codes available</p>';
}

function populateCompareSelectors() {
  const codeAType = document.getElementById('codeAType');
  const codeBType = document.getElementById('codeBType');

  let options = '';
  appData.modelCodes.forEach(code => {
    options += `<option value="${code.ModelCodeID}">${code.ModelCodeName} - ${code.DescriptionEN}</option>`;
  });

  codeAType.innerHTML = options;
  codeBType.innerHTML = options;

  // Populate version selectors
  updateVersionSelector('codeAType', 'codeAVersion');
  updateVersionSelector('codeBType', 'codeBVersion');

  codeAType.addEventListener('change', () => updateVersionSelector('codeAType', 'codeAVersion'));
  codeBType.addEventListener('change', () => updateVersionSelector('codeBType', 'codeBVersion'));
}

function updateVersionSelector(codeSelectId, versionSelectId) {
  const codeSelect = document.getElementById(codeSelectId);
  const versionSelect = document.getElementById(versionSelectId);
  const selectedCodeId = codeSelect.value;

  const versions = appData.modelCodeVersions.filter(v => v.ModelCodeID === selectedCodeId);

  let options = '';
  versions.forEach(version => {
    options += `<option value="${version.ModelCodeVersionID}">${version.Year} Edition</option>`;
  });

  versionSelect.innerHTML = options;
}

// ============================================
// Navigation Functions
// ============================================
const sections = {
  home: document.getElementById('homeSection'),
  library: document.getElementById('librarySection'),
  search: document.getElementById('searchSection'),
  compare: document.getElementById('compareSection')
};

const sidebarItems = document.querySelectorAll('.sidebar-item');

function showSection(sectionName) {
  Object.values(sections).forEach(section => {
    if (section) section.classList.remove('active');
  });

  if (sections[sectionName]) {
    sections[sectionName].classList.add('active');
  }

  sidebarItems.forEach(item => {
    item.classList.remove('active');
    if (item.dataset.section === sectionName) {
      item.classList.add('active');
    }
  });
}

sidebarItems.forEach(item => {
  item.addEventListener('click', function() {
    const section = this.dataset.section;
    if (section) showSection(section);
  });
});

document.querySelectorAll('[data-nav]').forEach(card => {
  card.addEventListener('click', function() {
    const section = this.dataset.nav;
    showSection(section);
  });
});

function toggleLibraryMenu() {
  const submenu = document.getElementById('librarySubmenu');
  const icon = document.getElementById('libraryMenuIcon');

  if (submenu.style.maxHeight === '0px' || submenu.style.maxHeight === '') {
    submenu.style.maxHeight = submenu.scrollHeight + 'px';
    icon.classList.add('rotate-180');
  } else {
    submenu.style.maxHeight = '0px';
    icon.classList.remove('rotate-180');
  }
}

// ============================================
// Library Functions
// ============================================
let currentVersionId = null;
let currentCodeId = null;

function loadCodeFromSidebar(versionId, codeId) {
  currentVersionId = versionId;
  currentCodeId = codeId;

  const version = appData.modelCodeVersions.find(v => v.ModelCodeVersionID === versionId);
  const code = appData.modelCodes.find(c => c.ModelCodeID === codeId);

  if (code && version) {
    document.getElementById('codeTitle').textContent = `${code.ModelCodeName} ${version.Year}`;
    document.getElementById('codeSubtitle').textContent = code.DescriptionEN;
  }

  loadChapterList(versionId);
  showSection('library');
}

function loadChapterList(versionId) {
  const chapterList = document.getElementById('chapterList');
  const chapters = appData.codeChapters.filter(ch => ch.ModelCodeVersionID === versionId);

  let html = '';
  chapters.forEach(chapter => {
    html += `
      <div class="chapter-item p-3 rounded-lg bg-gray-50 hover:bg-[#A8D0E6]"
           data-chapter-id="${chapter.ChapterID}"
           onclick="loadChapterContent('${chapter.ChapterID}')">
        <div class="flex items-center justify-between">
          <div>
            <span class="font-semibold text-[#24305E]">Chapter ${chapter.Chapter}</span>
            <p class="text-sm text-gray-600">${chapter.TitleKR || chapter.TitleEN}</p>
          </div>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
      </div>
    `;
  });

  chapterList.innerHTML = html || '<p class="text-gray-500 text-sm">No chapters available</p>';
}

function loadChapterContent(chapterId) {
  const contentArea = document.getElementById('libraryContent');
  const chapter = appData.codeChapters.find(ch => ch.ChapterID === chapterId);

  if (!chapter) {
    contentArea.innerHTML = '<p class="text-gray-500">Chapter not found</p>';
    return;
  }

  // Highlight active chapter
  document.querySelectorAll('.chapter-item').forEach(item => {
    item.classList.remove('active');
    if (item.dataset.chapterId === chapterId) {
      item.classList.add('active');
    }
  });

  // Get all attachment IDs for this ModelCodeVersionID
  const allVersionAttachments = appData.codeAttachments.filter(
    att => att.ModelCodeVersionID === currentVersionId
  );
  const allVersionAttachmentIds = new Set(allVersionAttachments.map(att => att.AttachmentID));

  // Get attachments specifically for this chapter
  const chapterAttachments = allVersionAttachments.filter(
    att => String(att.Chapter) === String(chapter.Chapter)
  );
  const chapterAttachmentIds = new Set(chapterAttachments.map(att => att.AttachmentID));

  // Format chapter number for OrderKey matching
  const chapterStr = String(chapter.Chapter);
  let chapterPrefix;
  if (chapterStr.toLowerCase().startsWith('annex')) {
    chapterPrefix = 'Anne';
  } else {
    chapterPrefix = chapterStr.padStart(4, '0').substring(0, 4);
  }

  // Filter contents using OrderKey + ChapterID + ModelCodeVersionID combination
  // Strategy:
  // 1. Content with AttachmentID: Check if AttachmentID belongs to this version
  // 2. Content without AttachmentID: Only for IBC (MCV002), match by OrderKey
  const contents = appData.codeContents.filter(c => {
    // Check if OrderKey matches this chapter
    const orderKeyMatches = c.OrderKey && c.OrderKey.startsWith(chapterPrefix);

    // Case 1: Content has AttachmentID
    if (c.AttachmentID) {
      // Handle multiple AttachmentIDs (e.g., "D001;D002")
      const attIds = c.AttachmentID.split(';').map(id => id.trim());
      const hasVersionAttachment = attIds.some(id => allVersionAttachmentIds.has(id));

      // Include if: belongs to this version AND matches chapter via OrderKey or AttachmentID chapter
      if (hasVersionAttachment) {
        // Check if any attachment matches this chapter directly
        const hasChapterAttachment = attIds.some(id => chapterAttachmentIds.has(id));
        return hasChapterAttachment || orderKeyMatches;
      }
      return false;
    }

    // Case 2: Content without AttachmentID (only for IBC since most IBC content lacks AttachmentID)
    if (currentVersionId === 'MCV002' && !c.AttachmentID) {
      return orderKeyMatches;
    }

    return false;
  });

  let html = `
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-[#24305E] mb-2">Chapter ${chapter.Chapter}: ${chapter.TitleEN}</h2>
      <p class="text-lg text-gray-600 mb-4">${chapter.TitleKR || ''}</p>
      ${chapter.ChapterComment ? `<div class="bg-gray-50 p-4 rounded-lg text-gray-700 text-sm leading-relaxed whitespace-pre-line">${chapter.ChapterComment}</div>` : ''}
    </div>
    <div class="space-y-4">
  `;

  contents.forEach(content => {
    // Handle multiple AttachmentIDs (e.g., "D001;D002")
    let attachments = [];
    if (content.AttachmentID) {
      const attIds = content.AttachmentID.split(';').map(id => id.trim());
      attachments = appData.codeAttachments.filter(a => attIds.includes(a.AttachmentID));
    }

    html += `
      <div class="bg-gray-50 p-4 rounded-lg">
        <h3 class="font-semibold text-[#24305E] mb-2">${content.TitleEN || ''}</h3>
        <p class="text-base text-gray-600 mb-2">${content.TitleKR || ''}</p>
        <p class="text-gray-700 leading-relaxed mb-2">${content.ContentEN || ''}</p>
        <p class="text-gray-600 text-base leading-relaxed mb-3">${content.ContentKR || ''}</p>
        ${content.Comment ? `
          <div class="mt-3 pt-3 border-t border-gray-200 bg-[#FEE9EC] bg-opacity-30 p-3 rounded-lg">
            <label class="text-xs font-semibold text-[#F76C6C] mb-1 block">Note</label>
            <div class="text-base text-gray-700 whitespace-pre-line">${content.Comment}</div>
          </div>
        ` : ''}
        ${renderAttachments(attachments)}
      </div>
    `;
  });

  html += '</div>';

  if (contents.length === 0) {
    html += '<p class="text-gray-500 text-center py-8">이 챕터에 대한 콘텐츠가 아직 없습니다.</p>';
  }

  contentArea.innerHTML = html;
}

function renderAttachments(attachments) {
  if (!attachments || attachments.length === 0) return '';

  let html = '<div class="mt-3 pt-3 border-t border-gray-200"><div class="figures-scroll">';

  attachments.forEach(att => {
    const imageFile = getImagePath(att.FileName);
    const label = att.Type === 'T' ? `Table ${att.Number || ''}` : `Figure ${att.Number || ''}`;

    html += `
      <div class="flex-shrink-0 w-32 h-32 border-2 border-gray-200 rounded-lg p-2 cursor-pointer bg-white hover:border-[#A8D0E6] transition-all" onclick="openImageModal('${att.AttachmentID}')">
        <img alt="${label}" class="w-full h-20 object-contain rounded bg-gray-50" src="${imageFile}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 fill=%22%23999%22>No Image</text></svg>'"/>
        <p class="mt-auto pt-1 text-center text-xs font-medium text-gray-700 border-t border-gray-200">${label}</p>
      </div>
    `;
  });

  html += '</div></div>';
  return html;
}

function getImagePath(filename) {
  if (!filename) return '';
  // Add image/ prefix and try common extensions
  const extensions = ['.jpg', '.jpeg', '.png', '.gif'];
  // Check if filename already has extension
  const hasExtension = extensions.some(ext => filename.toLowerCase().endsWith(ext));
  if (hasExtension) {
    return IMAGE_BASE_PATH + filename;
  }
  // Try .jpg first as most common
  return IMAGE_BASE_PATH + filename + '.jpg';
}

// ============================================
// Image Modal Functions
// ============================================
let currentZoom = 1;

function openImageModal(attachmentId) {
  const attachment = appData.codeAttachments.find(a => a.AttachmentID === attachmentId);
  if (!attachment) return;

  const modal = document.getElementById('imageModal');
  const modalImage = document.getElementById('modalImage');
  const modalTitle = document.getElementById('modalTitle');
  const modalSubtitle = document.getElementById('modalSubtitle');
  const modalContent = document.getElementById('modalContent');

  const imageFile = getImagePath(attachment.FileName);
  const label = attachment.Type === 'T' ? `Table ${attachment.Number || ''}` : `Figure ${attachment.Number || ''}`;

  modalTitle.textContent = attachment.AttachTitleEN || label;
  modalSubtitle.textContent = attachment.AttachTitleKR || '';
  modalImage.src = imageFile;

  let contentHtml = '';
  if (attachment.AttachContentEN) {
    contentHtml += `<div class="text-gray-700 whitespace-pre-line">${attachment.AttachContentEN}</div>`;
  }
  if (attachment.AttachContentKR) {
    contentHtml += `<div class="text-gray-600 whitespace-pre-line mt-2">${attachment.AttachContentKR}</div>`;
  }
  if (attachment.AttachComment) {
    contentHtml += `<div class="mt-3 p-3 bg-yellow-50 rounded-lg text-sm text-gray-700">${attachment.AttachComment}</div>`;
  }
  modalContent.innerHTML = contentHtml;

  currentZoom = 1;
  modalImage.style.transform = `scale(${currentZoom})`;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
}

function zoomImage(action) {
  const modalImage = document.getElementById('modalImage');

  if (action === 'in') {
    currentZoom = Math.min(currentZoom + 0.25, 3);
  } else if (action === 'out') {
    currentZoom = Math.max(currentZoom - 0.25, 0.5);
  } else {
    currentZoom = 1;
  }

  modalImage.style.transform = `scale(${currentZoom})`;
}

// Close modal on outside click
document.getElementById('imageModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============================================
// Search Functions
// ============================================
function clearSearchInput() {
  document.getElementById('topSearchInput').value = '';
}

function performTopSearch() {
  const query = document.getElementById('topSearchInput').value.trim();
  if (!query) return;

  performSearchWithQuery(query);
  showSection('search');
}

function performSearch() {
  const query = document.getElementById('keywordInput').value.trim();
  performSearchWithQuery(query);
}

function performSearchWithQuery(query) {
  if (!query) {
    document.getElementById('resultsList').innerHTML = '<p class="text-gray-500 text-center py-4">검색어를 입력하세요.</p>';
    document.getElementById('resultCount').textContent = '0개 결과';
    return;
  }

  const results = [];
  const lowerQuery = query.toLowerCase();

  // Search in code contents
  appData.codeContents.forEach(content => {
    const searchText = [
      content.TitleEN, content.TitleKR,
      content.ContentEN, content.ContentKR,
      content.Comment, content.Index
    ].filter(Boolean).join(' ').toLowerCase();

    if (searchText.includes(lowerQuery)) {
      results.push({
        type: 'content',
        data: content
      });
    }
  });

  // Search in chapters
  appData.codeChapters.forEach(chapter => {
    const searchText = [
      chapter.TitleEN, chapter.TitleKR,
      chapter.ChapterComment
    ].filter(Boolean).join(' ').toLowerCase();

    if (searchText.includes(lowerQuery)) {
      results.push({
        type: 'chapter',
        data: chapter
      });
    }
  });

  displaySearchResults(results, query);
}

function displaySearchResults(results, query) {
  const resultsList = document.getElementById('resultsList');
  const resultCount = document.getElementById('resultCount');

  resultCount.textContent = `${results.length}개 결과`;

  if (results.length === 0) {
    resultsList.innerHTML = '<p class="text-gray-500 text-center py-4">검색 결과가 없습니다.</p>';
    return;
  }

  let html = '';
  results.slice(0, 50).forEach((result, index) => {
    if (result.type === 'content') {
      const content = result.data;
      // Find which code/version this content belongs to
      const codeInfo = getCodeInfoForContent(content);
      html += `
        <div class="result-item p-4 border-b border-gray-200 cursor-pointer" onclick="navigateToContent('${content.OrderKey || ''}', '${content.AttachmentID || ''}')">
          <div class="flex items-center gap-2 mb-1">
            ${codeInfo ? `<span class="text-xs bg-[#24305E] text-white px-2 py-0.5 rounded">${codeInfo.codeName}</span>` : ''}
            <span class="text-xs text-gray-400">${content.OrderKey || ''}</span>
          </div>
          <h3 class="font-semibold text-[#24305E]">${highlightText(content.TitleEN || '', query)}</h3>
          <p class="text-sm text-gray-600">${highlightText(content.TitleKR || '', query)}</p>
          <p class="text-sm text-gray-500 mt-2 line-clamp-2">${highlightText((content.ContentKR || content.ContentEN || '').substring(0, 200), query)}...</p>
        </div>
      `;
    } else if (result.type === 'chapter') {
      const chapter = result.data;
      const version = appData.modelCodeVersions.find(v => v.ModelCodeVersionID === chapter.ModelCodeVersionID);
      const code = version ? appData.modelCodes.find(c => c.ModelCodeID === version.ModelCodeID) : null;
      const codeName = code ? `${code.ModelCodeName} ${version.Year}` : '';
      html += `
        <div class="result-item p-4 border-b border-gray-200 cursor-pointer" onclick="loadChapterFromSearch('${chapter.ChapterID}', '${chapter.ModelCodeVersionID}')">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs bg-[#374785] text-white px-2 py-0.5 rounded">${codeName}</span>
          </div>
          <h3 class="font-semibold text-[#24305E]">Chapter ${chapter.Chapter}: ${highlightText(chapter.TitleEN || '', query)}</h3>
          <p class="text-sm text-gray-600">${highlightText(chapter.TitleKR || '', query)}</p>
        </div>
      `;
    }
  });

  if (results.length > 50) {
    html += `<p class="text-center text-gray-500 py-4">외 ${results.length - 50}개 결과...</p>`;
  }

  resultsList.innerHTML = html;
}

// Get code info for a content item
function getCodeInfoForContent(content) {
  if (content.AttachmentID) {
    // Handle multiple AttachmentIDs (e.g., "D001;D002")
    const attIds = content.AttachmentID.split(';').map(id => id.trim());
    const attachment = appData.codeAttachments.find(a => attIds.includes(a.AttachmentID));
    if (attachment) {
      const version = appData.modelCodeVersions.find(v => v.ModelCodeVersionID === attachment.ModelCodeVersionID);
      const code = version ? appData.modelCodes.find(c => c.ModelCodeID === version.ModelCodeID) : null;
      if (code && version) {
        return {
          codeName: `${code.ModelCodeName} ${version.Year}`,
          versionId: attachment.ModelCodeVersionID,
          codeId: code.ModelCodeID
        };
      }
    }
  }
  return null;
}

// Navigate to content from search results
function navigateToContent(orderKey, attachmentId) {
  let targetVersionId = null;
  let targetChapterId = null;

  // Try to find version via AttachmentID
  if (attachmentId) {
    // Handle multiple AttachmentIDs (e.g., "D001;D002")
    const attIds = attachmentId.split(';').map(id => id.trim());
    const attachment = appData.codeAttachments.find(a => attIds.includes(a.AttachmentID));
    if (attachment) {
      targetVersionId = attachment.ModelCodeVersionID;
      // Find matching chapter using OrderKey if available, or attachment chapter
      if (orderKey) {
        const chapterNum = orderKey.substring(0, 4);
        const chapter = appData.codeChapters.find(ch =>
          ch.ModelCodeVersionID === targetVersionId &&
          String(ch.Chapter).padStart(4, '0').substring(0, 4) === chapterNum
        );
        if (chapter) {
          targetChapterId = chapter.ChapterID;
        }
      }
      // Fallback to attachment chapter
      if (!targetChapterId) {
        const chapter = appData.codeChapters.find(ch =>
          ch.ModelCodeVersionID === targetVersionId &&
          String(ch.Chapter) === String(attachment.Chapter)
        );
        if (chapter) {
          targetChapterId = chapter.ChapterID;
        }
      }
    }
  }

  // If not found via AttachmentID, try OrderKey for IBC (MCV002)
  if (!targetVersionId && orderKey) {
    const chapterNum = orderKey.substring(0, 4);
    // First try IBC chapters as default for content without AttachmentID
    const chapter = appData.codeChapters.find(ch =>
      ch.ModelCodeVersionID === 'MCV002' &&
      String(ch.Chapter).padStart(4, '0').substring(0, 4) === chapterNum
    );
    if (chapter) {
      targetVersionId = 'MCV002';
      targetChapterId = chapter.ChapterID;
    }
  }

  if (targetVersionId && targetChapterId) {
    const version = appData.modelCodeVersions.find(v => v.ModelCodeVersionID === targetVersionId);
    const code = version ? appData.modelCodes.find(c => c.ModelCodeID === version.ModelCodeID) : null;
    if (code) {
      loadCodeFromSidebar(targetVersionId, code.ModelCodeID);
      setTimeout(() => loadChapterContent(targetChapterId), 100);
    }
  }
}

function highlightText(text, query) {
  if (!text || !query) return text;
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, '<span class="search-highlight">$1</span>');
}

function loadChapterFromSearch(chapterId, versionId) {
  const chapter = appData.codeChapters.find(ch => ch.ChapterID === chapterId);
  if (!chapter) return;

  const version = appData.modelCodeVersions.find(v => v.ModelCodeVersionID === versionId);
  const code = version ? appData.modelCodes.find(c => c.ModelCodeID === version.ModelCodeID) : null;

  if (code && version) {
    loadCodeFromSidebar(versionId, code.ModelCodeID);
    setTimeout(() => loadChapterContent(chapterId), 100);
  }
}

function resetSearch() {
  document.getElementById('keywordInput').value = '';
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('resultCount').textContent = '0개 결과';
}

// ============================================
// Keyboard Shortcuts
// ============================================
document.addEventListener('keydown', function(e) {
  // Escape to close modal
  if (e.key === 'Escape') {
    closeModal();
  }

  // Ctrl/Cmd + K for search focus
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('topSearchInput').focus();
  }
});

// ============================================
// Initialize App
// ============================================
document.addEventListener('DOMContentLoaded', function() {
  loadAllData();
});
