site_name: US Code Navigator
site_description: 미국 건축 및 소방 코드 탐색 도구
site_author: Your Team
site_url: https://nabiyahs.github.io/us-code-navigator/

# Repository
repo_name: Nabiyahs/us-code-navigator
repo_url: https://github.com/Nabiyahs/us-code-navigator

# Theme
theme:
  name: material
  language: ko
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: blue
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Noto Sans KR
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate

# Plugins
plugins:
  - search:
      lang:
        - en
        - ko
      separator: '[\s\-\.]+'
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - IBC 2024:
    - 개요: ibc-2024/README.md
    - Chapter 2 - Definitions:
      - 개요: ibc-2024/chapter-02.md
      - Section 201: ibc-2024/section-201.md
      - Section 202: ibc-2024/section-202.md
    - Chapter 3 - Use and Occupancy:
      - 개요: ibc-2024/chapter-03.md
      - Section 304: ibc-2024/section-304.md
      - Section 307: ibc-2024/section-307.md
      - Section 311: ibc-2024/section-311.md
    - Chapter 4 - Special Requirements:
      - 개요: ibc-2024/chapter-04.md
      - Section 403: ibc-2024/section-403.md
      - Section 414: ibc-2024/section-414.md
      - Section 415: ibc-2024/section-415.md
  - NFPA 13 2025:
    - 개요: nfpa-13-2025/README.md
  - NFPA 14 2024:
    - 개요: nfpa-14-2024/README.md
  - NFPA 20 2025:
    - 개요: nfpa-20-2025/README.md
  - 사용 가이드: guide.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nabiyahs/us-code-navigator

  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Google Analytics ID (optional)

# CSS customization
extra_css:
  - stylesheets/extra.css

# JavaScript customization
extra_javascript:
  - javascripts/extra.js
